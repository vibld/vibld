<!doctype html><meta charset="utf-8" />
<style>
  * {
    margin: 0;
    box-sizing: border-box;
  }
  body {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 80px;
    background: oklch(0.985 0.006 60);
    color: oklch(0.2 0.015 40);
    font-family:
      ui-sans-serif,
      system-ui,
      -apple-system,
      'Segoe UI',
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
  }
  .mono {
    font-family:
      ui-monospace, 'SF Mono', 'Cascadia Code', 'Courier New', monospace;
  }
  .word {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .eyebrow {
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: oklch(0.32 0.14 45);
    margin-top: 10px;
  }
  h1 {
    font-size: 70px;
    line-height: 1.04;
    letter-spacing: -0.033em;
    font-weight: 600;
    margin-top: 22px;
    max-width: 16ch;
  }
  p {
    font-size: 27px;
    line-height: 1.4;
    color: oklch(0.47 0.015 40);
    margin-top: 22px;
    max-width: 34ch;
  }
  .rule {
    height: 5px;
    width: 104px;
    background: oklch(0.68 0.19 45);
    margin-top: 28px;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 22px;
    color: oklch(0.47 0.015 40);
    border-top: 1px solid oklch(0.2 0.015 40/0.13);
    padding-top: 20px;
  }
</style>
<body>
  <div>
    <div class="word mono">vibld</div>
    <div class="eyebrow mono">Vibe. Build. Ship.</div>
    <h1>An AI app builder that writes code you'd merge.</h1>
    <div class="rule"></div>
    <p>Conventional, portable projects. No proprietary runtime.</p>
  </div>
  <footer>
    <span>vibld.com</span><span class="mono">github.com/vibld</span>
  </footer>
</body>
