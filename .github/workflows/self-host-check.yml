name: Self-host check

# Deploys a second, separately named copy of vibld from this commit, the way
# https://vibld.com/docs/deploying tells a self-hoster to, and checks that
# it comes up and refuses what it has not been given (D80, D115). Signed in
# with the owner's password (D123), it then runs one real build on the copy
# and opens its preview, and does the same under Docker (D122), with
# scripts/self-host-journey.mjs. Every
# Worker, database, bucket and Workflow name is derived from `prefix` by
# scripts/self-host.mjs, which refuses to write a configuration that still
# names vibld's own deployment, so this can run in the same account as
# vibld without touching it.
#
# It creates the copy's D1 database and R2 bucket itself and, unless `keep`
# is ticked, removes everything it made at the end, pass or fail (D117), with
# scripts/self-host-resources.mjs.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Names start with this (lowercase; never "vibld")
        required: true
        default: selfhost
      auth:
        description: How the copy signs in (D123). Only owner is signed in and built on.
        type: choice
        options: [owner, clerk]
        default: owner
      clerk_frontend_api_url:
        description: With clerk, a Clerk instance's Frontend API URL (https://..., no path)
        required: false
        default: ''
      provider:
        description: The model provider the builder selects
        type: choice
        options: [deepseek, anthropic, openai]
        default: deepseek
      keep:
        description: Leave the copy deployed afterwards (otherwise torn down)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: self-host-check
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a prefixed copy and check it
    if: github.repository == 'vibld/vibld-internal'
    runs-on: ubuntu-24.04
    # One real build of up to twenty-five minutes on top of the deploy.
    timeout-minutes: 60
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: pnpm dlx wrangler@4.137.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the inputs
        env:
          AUTH: ${{ inputs.auth }}
          CLERK_URL: ${{ inputs.clerk_frontend_api_url }}
        run: |
          if [ "$AUTH" = clerk ] && [ -z "$CLERK_URL" ]; then
            echo "::error::auth is clerk, so clerk_frontend_api_url is needed."
            exit 1
          fi

      - name: Create this copy's database and bucket
        id: state
        env:
          PREFIX: ${{ inputs.prefix }}
        run: node scripts/self-host-resources.mjs create "$PREFIX"

      # Inputs reach the script through the environment, never pasted into
      # the shell, so a value cannot run as a command.
      - name: Write this copy's Wrangler configuration
        env:
          PREFIX: ${{ inputs.prefix }}
          D1_ID: ${{ steps.state.outputs.d1_database_id }}
          AUTH: ${{ inputs.auth }}
          CLERK_URL: ${{ inputs.clerk_frontend_api_url }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          node -e '
            const { writeFileSync } = require("node:fs");
            const clerk = process.env.AUTH === "clerk";
            writeFileSync(process.argv[1], JSON.stringify({
              prefix: process.env.PREFIX,
              d1DatabaseId: process.env.D1_ID,
              auth: process.env.AUTH,
              ...(clerk ? { clerkFrontendApiUrl: process.env.CLERK_URL } : {}),
              provider: process.env.PROVIDER,
              rateLimitNamespaceBase: 5001,
            }));
          ' "$RUNNER_TEMP/self-host.json"
          node scripts/self-host.mjs "$RUNNER_TEMP/self-host.json"

      - name: Apply the migrations to this copy's database
        working-directory: apps/web
        env:
          PREFIX: ${{ inputs.prefix }}
        run: $WRANGLER d1 migrations apply "$PREFIX-control-plane" --remote -c wrangler.self-host.jsonc

      # The order https://vibld.com/docs/deploying gives: the builder's
      # service bindings name the other two, and Cloudflare refuses a
      # binding to a Worker that does not exist yet (code 10143).
      - name: Deploy the publish Worker
        working-directory: apps/publish
        run: $WRANGLER deploy -c wrangler.self-host.jsonc

      - name: Deploy the sandbox Worker
        working-directory: apps/preview
        run: $WRANGLER deploy -c wrangler.self-host.jsonc

      # No Clerk publishable key: a clerk copy is checked signed out.
      - name: Build the builder
        run: pnpm --filter @vibld/web build

      - name: Deploy the builder
        id: web
        working-directory: apps/web
        run: |
          set -o pipefail
          $WRANGLER deploy -c wrangler.self-host.jsonc | tee "$RUNNER_TEMP/web-deploy.log"
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/web-deploy.log" | head -1)"
          [ -n "$url" ] || { echo "::error::The deploy printed no workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Fresh values for this copy alone, never vibld's, given on stdin so
      # they reach no log. Each side of a service binding gets the same one.
      # The owner's password is made here too, masked, and handed to the
      # journey below through the job's environment. The model key is the
      # 'preview' environment's, as for vibld's own preview.
      - name: Set the shared secrets
        env:
          AUTH: ${{ inputs.auth }}
          PROVIDER: ${{ inputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          put() { (cd "apps/$1" && printf '%s' "$3" | $WRANGLER secret put "$2" -c wrangler.self-host.jsonc >/dev/null); }
          preview="$(openssl rand -hex 32)"
          publish="$(openssl rand -hex 32)"
          share="$(openssl rand -hex 32)"
          put web PREVIEW_INTERNAL_SECRET "$preview"
          put preview PREVIEW_INTERNAL_SECRET "$preview"
          put web PUBLISH_INTERNAL_SECRET "$publish"
          put publish PUBLISH_INTERNAL_SECRET "$publish"
          put preview PREVIEW_SHARE_SECRET "$share"
          case "$PROVIDER" in
            deepseek) key=DEEPSEEK_API_KEY ;;
            openai) key=OPENAI_API_KEY ;;
            *) key=ANTHROPIC_API_KEY ;;
          esac
          if [ -z "${!key}" ]; then
            echo "::error::$key is not set on the 'preview' environment, so the copy has nothing to build with."
            exit 1
          fi
          put web "$key" "${!key}"
          if [ "$AUTH" = owner ]; then
            password="$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            put web VIBLD_OWNER_PASSWORD "$password"
            echo "VIBLD_OWNER_PASSWORD=$password" >> "$GITHUB_ENV"
          fi

      # What can be checked signed out: the interface is served, and the
      # API refuses an anonymous caller rather than answering or failing.
      - name: Check the deployed copy
        env:
          URL: ${{ steps.web.outputs.url }}
        run: |
          set -euo pipefail
          sleep 10
          page="$(curl -sS -o "$RUNNER_TEMP/index.html" -w '%{http_code}' "$URL/")"
          api="$(curl -sS -o "$RUNNER_TEMP/config.json" -w '%{http_code}' "$URL/api/config")"
          {
            echo "## Self-host check"
            echo
            echo "Builder: $URL"
            echo
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| \`/\` serves the interface | $page |"
            echo "| \`/api/config\` refuses a signed-out caller | $api |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$page" = 200 ] && grep -qi '<html' "$RUNNER_TEMP/index.html" \
            || { echo "::error::/ answered $page"; exit 1; }
          case "$api" in
            401|403) ;;
            *) echo "::error::/api/config answered $api to a signed-out caller"; cat "$RUNNER_TEMP/config.json"; exit 1 ;;
          esac

      # Outside the workspace and not in the lockfile, as for the end-to-end
      # check on production: nothing else in the repository uses it.
      - name: Install Playwright
        if: ${{ inputs.auth == 'owner' }}
        run: |
          mkdir -p "$RUNNER_TEMP/journey"
          cd "$RUNNER_TEMP/journey"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium

      # D122: sign in as the owner, build, open the preview, delete the
      # project.
      - name: Sign in and build
        if: ${{ inputs.auth == 'owner' }}
        env:
          SELF_HOST_URL: ${{ steps.web.outputs.url }}
        run: node scripts/self-host-journey.mjs "$RUNNER_TEMP/journey" "$RUNNER_TEMP/journey-out"

      # Screenshots and results.json. No trace: it would record the cookie.
      - name: Upload the screenshots
        if: ${{ always() && inputs.auth == 'owner' }}
        uses: actions/upload-artifact@v7
        with:
          name: self-host-cloudflare
          path: ${{ runner.temp }}/journey-out
          retention-days: 14
          if-no-files-found: ignore

      # D117. Runs whether the check passed or failed, so a failed run does
      # not leave a half-deployed copy behind.
      - name: Tear the copy down
        if: ${{ always() && !inputs.keep }}
        env:
          PREFIX: ${{ inputs.prefix }}
        run: node scripts/self-host-resources.mjs teardown "$PREFIX"

  # The same journey under docker compose (D126), on this runner's own
  # Docker: previews run as sibling containers (D137). Nothing outlives the
  # job, so there is nothing to tear down.
  docker:
    name: Run it under Docker, sign in and build
    if: github.repository == 'vibld/vibld-internal'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Written to .env, which compose reads; the model key is the
      # 'preview' environment's and the password is made for this job.
      - name: Start it
        env:
          PROVIDER: ${{ inputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            deepseek) key=DEEPSEEK_API_KEY ;;
            openai) key=OPENAI_API_KEY ;;
            *) key=ANTHROPIC_API_KEY ;;
          esac
          if [ -z "${!key}" ]; then
            echo "::error::$key is not set on the 'preview' environment, so the copy has nothing to build with."
            exit 1
          fi
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "VIBLD_OWNER_PASSWORD=$password" >> "$GITHUB_ENV"
          umask 077
          printf 'VIBLD_OWNER_PASSWORD=%s\nVIBLD_PROVIDER=%s\n%s=%s\n' "$password" "$PROVIDER" "$key" "${!key}" > .env
          docker compose up --build --detach

      - name: Wait for it
        run: node docker/smoke.mjs 900

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/journey"
          cd "$RUNNER_TEMP/journey"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Sign in and build
        env:
          SELF_HOST_URL: http://localhost:8787
        run: node scripts/self-host-journey.mjs "$RUNNER_TEMP/journey" "$RUNNER_TEMP/journey-out"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-host-docker
          path: ${{ runner.temp }}/journey-out
          retention-days: 14
          if-no-files-found: ignore

      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -n 300
