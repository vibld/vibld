name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format diagnostic
        run: |
          pnpm exec prettier --write packages/core/test/run-budget.test.ts
          git diff -- packages/core/test/run-budget.test.ts
          exit 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
