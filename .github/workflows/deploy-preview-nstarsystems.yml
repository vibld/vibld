name: Deploy nstarsystems.com preview

# Throwaway: deploys the Vibld-generated project in preview/nstarsystems/ as
# its own Cloudflare Worker, purely so it can be viewed live. See the README
# in that directory. Manual only, and lives only on the preview/nstarsystems
# branch -- not part of the product, not merged to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preview-nstarsystems
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy the nstarsystems.com preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Reuses the same "preview" environment apps/web deploys to -- its
    # CLOUDFLARE_API_TOKEN already has Workers Scripts: Edit for the whole
    # account (apps/web/README.md explains why it can't be scoped tighter),
    # which covers deploying this additional Worker too.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add both to the \"preview\" environment (Settings -> Environments)." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Plain npm, not pnpm: this is a generated project (ADR-0002), tested to
      # build with ordinary npm commands and no Vibld dependency, and it is
      # deliberately not part of the pnpm workspace.
      - name: Install dependencies
        working-directory: preview/nstarsystems
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: preview/nstarsystems
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        shell: bash
        working-directory: preview/nstarsystems
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          log="$RUNNER_TEMP/wrangler-deploy.log"
          npx wrangler@4.129.1 deploy | tee "$log"
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log" | head -n 1 || true)"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Deploy succeeded but the URL could not be read from wrangler output"
          fi
