name: Deploy marketing site

# Manual only, like "Deploy web preview" -- an automatic deploy on every push
# to main would redeploy vibld.com on every unrelated merge.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-marketing
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy vibld.com
    # Runs only in the private working repository. The public copy
    # (vibld/vibld) has none of the secrets or deployment environments this
    # job reads, so there it could only fail.
    if: github.repository == 'vibld/vibld-internal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Credentials live on this environment rather than the repository, so
    # they are reachable only from a job that names it, and any protection
    # rule configured on it (a required reviewer) gates the run before a
    # single step executes.
    environment:
      name: marketing
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          [ -n "$RESEND_API_KEY" ] || { echo "::error::RESEND_API_KEY is not set"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add all three to the \"marketing\" environment (Settings -> Environments)." >&2
            echo "The Cloudflare token needs \"Workers Scripts: Edit\" and \"DNS: Edit\" on the vibld.com zone -- the routes in wrangler.jsonc create that zone's records on first deploy." >&2
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @vibld/marketing build

      # RESEND_API_KEY and TURNSTILE_SECRET_KEY are Worker secrets, not build
      # inputs, so they are pushed separately from the deploy -- the same
      # reasoning as the model-key sync in deploy-web-preview.yml.
      #
      # TURNSTILE_SECRET_KEY is optional, unlike RESEND_API_KEY: it is not in
      # "Require deploy credentials" above, and worker/index.ts skips the
      # Turnstile check entirely when it is unset rather than failing closed
      # (docs/decisions.md L29) -- so it is synced only when present, the
      # same `[ -n ... ]` pattern deploy-web-preview.yml uses for the model
      # keys, rather than being required like RESEND_API_KEY is.
      - name: Sync Worker secrets
        shell: bash
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          # The value goes in on stdin so it never appears in a command line
          # or in the run log.
          printf '%s' "$RESEND_API_KEY" | pnpm dlx wrangler@4.137.0 secret put RESEND_API_KEY
          echo "Synced RESEND_API_KEY." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            printf '%s' "$TURNSTILE_SECRET_KEY" | pnpm dlx wrangler@4.137.0 secret put TURNSTILE_SECRET_KEY
            echo "Synced TURNSTILE_SECRET_KEY." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TURNSTILE_SECRET_KEY not set -- Turnstile verification stays disabled on this deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        shell: bash
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          log="$RUNNER_TEMP/wrangler-deploy.log"
          pnpm dlx wrangler@4.137.0 deploy | tee "$log"
          url="$(grep -oE 'https://vibld\.com' "$log" | head -n 1 || true)"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
          echo "Deployed vibld-marketing (vibld.com, www.vibld.com)" >> "$GITHUB_STEP_SUMMARY"

      # A green deploy only says the upload worked, not that the site is
      # answering. This used to warn and pass, for the days when a freshly
      # routed domain could still be propagating; vibld.com has been routed
      # since, so a site that does not answer is a failed deploy (#59).
      # A few tries, a few seconds apart, cover the edge picking up the new
      # version.
      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://vibld.com/ || echo "000")"
            [ "$status" = "200" ] && break
            sleep 6
          done
          if [ "$status" != "200" ]; then
            echo "::error::https://vibld.com/ answered $status after five tries."
            exit 1
          fi
          echo "https://vibld.com/ is live." >> "$GITHUB_STEP_SUMMARY"

      - name: Notify IndexNow
        working-directory: apps/marketing
        run: pnpm indexnow
