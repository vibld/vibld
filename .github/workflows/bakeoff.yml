name: Model bakeoff

# Runs the versioned prompt set against real models and keeps what they
# produced. This is the only thing that answers "which model writes a good
# website", which the stub cannot (packages/eval/README.md), and internal issue 9/#10 ask
# for reliability rather than a single sample, so it runs each case more than
# once and reports the spread.
#
# Manual only, and every run spends real money. The credentials live on the
# "preview" environment, so any protection rule configured there gates the run
# before a single step executes.
#
# A project is accepted only if it passes the eval's checks and installs and
# builds (Chris, 2026-09-27), and each model gets two figures: accepted as
# generated, and accepted after one repair turn, the product's own repair,
# sent the exact build error (packages/eval/README.md). That takes five jobs,
# split by one rule that has no exceptions: code a model wrote only ever runs
# in a job that holds no secrets, and a job that holds keys only ever reads a
# candidate's files as text.
#
#   bakeoff         keys     generates the candidates and eval-results.json
#   build           no keys  installs and builds each candidate
#   repair          keys     one repair turn for each that passed the checks
#                            and did not build
#   build-repaired  no keys  installs and builds what the repair wrote
#   report          no keys  joins the four result files into one table
#
# Only files cross between them, as artifacts.

# Named by the effort the file-writing steps were asked at (D70), so a run
# with them at a lower effort and one at the default can be told apart in
# the list of runs, not only once each is opened. Display text only: the
# value is never run as a command.
run-name: Model bakeoff (file steps at ${{ inputs.write_effort || 'default' }} effort)

on:
  workflow_dispatch:
    inputs:
      models:
        description: >-
          Comma-separated model ids from the catalogue. Each one runs the
          selected cases independently and gets its own report.
        required: true
        default: claude-opus-5-5,gpt-6-sol,deepseek-v4-pro
      cases:
        description: >-
          Comma-separated case ids. Required, and deliberately so: blank means
          every case in packages/eval/src/cases.ts, which multiplies the bill by
          however many cases that file holds.
        required: true
        default: vibld-marketing
      runs:
        description: >-
          How many times each model runs each case. Three is what #10's gate
          is written in terms of. This multiplies the bill by the same number.
        required: true
        default: '3'
      write_effort:
        description: >-
          Effort for the file-writing steps: low, medium, high, xhigh or max.
          Blank keeps the default. The outline is unaffected.
        required: false
        default: ''

permissions:
  contents: read

# Never two at once. Not cancel-in-progress: a cancelled run has already paid
# for whatever it generated, and cancelling it throws that away.
concurrency:
  group: bakeoff
  cancel-in-progress: false

jobs:
  bakeoff:
    name: Run the set against real models
    # Runs only in the private working repository. The public copy
    # (vibld/vibld) has none of the secrets or deployment environments this
    # job reads, so there it could only fail.
    if: github.repository == 'vibld/vibld-internal'
    runs-on: ubuntu-24.04
    # Generous, because a real generation takes minutes and the scope is an
    # input. A run that would exceed this wants splitting by model rather than
    # a bigger number here.
    timeout-minutes: 60
    environment: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every refusal here is cheaper than the one the eval would reach after
      # a model has been paid, and the blank-cases case is not a refusal the
      # eval can make for us: to it, no selection is a valid request for the
      # whole set.
      - name: Check what this run would spend
        shell: bash
        env:
          MODELS: ${{ inputs.models }}
          CASES: ${{ inputs.cases }}
          RUNS: ${{ inputs.runs }}
          WRITE_EFFORT: ${{ inputs.write_effort }}
        run: |
          set -euo pipefail
          # Exactly one of the efforts, or blank. A mistyped value would
          # otherwise be refused by the eval only after this step, and a run
          # that quietly measured the default would be reported as the other
          # arm of the D70 comparison.
          case "$WRITE_EFFORT" in
            ''|low|medium|high|xhigh|max) ;;
            *) echo "::error::write_effort must be blank or one of low, medium, high, xhigh, max, not \"$WRITE_EFFORT\"."; exit 1 ;;
          esac
          if [ -z "${CASES// /}" ]; then
            echo "::error::No case named. Blank selects every case in the set, which is not something to arrive at by leaving a box empty."
            exit 1
          fi
          if [ -z "${MODELS// /}" ]; then
            echo "::error::No model named."
            exit 1
          fi
          case "$RUNS" in
            ''|*[!0-9]*) echo "::error::runs must be a whole number, not \"$RUNS\"."; exit 1 ;;
          esac
          # `|| true` because grep exits 1 when it counts nothing, and this
          # must not depend on how `set -e` treats a failing command
          # substitution inside an assignment, which is not what it looks like.
          count() { printf '%s' "$1" | tr ',' '\n' | grep -c '[^[:space:]]' || true; }
          models=$(count "$MODELS")
          cases=$(count "$CASES")
          # 10# because bash reads a leading zero as octal while `liveRuns`
          # reads it with Number(). Unforced, "010" printed 8 runs here and
          # billed 10, so the line that exists to say what this costs would
          # have understated it by a quarter, and "08" and "09" aborted the
          # step outright as invalid octal. Measured for all five.
          runs=$((10#$RUNS))
          {
            echo "## Scope"
            echo
            echo "$models models x $cases cases x $runs runs = **$((models * cases * runs)) generations**, all of them billed."
            echo
            if [ -n "$WRITE_EFFORT" ]; then
              echo "Effort: the file-writing steps (and repairs' file steps) at **$WRITE_EFFORT**; the outline at its default."
            else
              echo "Effort: **every step at its default**."
            fi
            echo
            echo "Measured spend is reported at the end of the run, from the usage each provider reported."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the bakeoff
        id: bakeoff
        shell: bash
        env:
          # Dispatch inputs are untrusted text. They are passed through the
          # environment and only ever referenced as "$VAR"; interpolating
          # ${{ inputs.* }} into this script would let a crafted value run
          # shell commands in a step that holds every model key.
          MODELS: ${{ inputs.models }}
          CASES: ${{ inputs.cases }}
          VIBLD_EVAL_LIVE: '1'
          VIBLD_EVAL_MODELS: ${{ inputs.models }}
          VIBLD_EVAL_RUNS: ${{ inputs.runs }}
          VIBLD_EVAL_OUT: ${{ runner.temp }}/candidates
          WRITE_EFFORT: ${{ inputs.write_effort }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          # Only when one was asked for, so a blank input leaves the eval
          # exactly as it was before the input existed. Checked by the step
          # above; the eval refuses anything else as well.
          if [ -n "$WRITE_EFFORT" ]; then
            export VIBLD_WRITE_EFFORT="$WRITE_EFFORT"
          fi

          # Built as an array rather than interpolated into a string, so a
          # case id can never become a second argument or a shell operator.
          #
          # `printf '%s\n'`, with the newline, because `read` returns false on
          # a final line that has none and the loop body is then skipped for
          # it. With a single case that dropped the only --case, and no
          # selection means the whole set: nine generations silently becoming
          # fifty-four. The empty check below is the rule rather than the
          # instance, since anything that leaves this list empty has the same
          # consequence however it happened.
          args=()
          while IFS= read -r id; do
            [ -n "$id" ] && args+=(--case "$id")
          done < <(printf '%s\n' "$CASES" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')

          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::No case survived parsing \"$CASES\". Refusing rather than running the whole set."
            exit 1
          fi
          echo "Running: ${args[*]}"

          set +e
          pnpm --filter @vibld/eval run eval "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/bakeoff.log"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo
            echo '## Report'
            echo
            echo '```'
            cat "$RUNNER_TEMP/bakeoff.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Uploaded even when the run failed its expectations. Looking at what a
      # model got wrong is most of the reason to write any of this out, and a
      # failed case still cost what it cost. eval-results.json is written into
      # the same directory: which run passed which checks, and what it cost,
      # which is what the repair and the report read.
      #
      # include-hidden-files because upload-artifact has excluded dotfiles by
      # default since v4.4, and a conventional project has a .gitignore. A
      # candidate missing it is not the project that was evaluated, which
      # defeats keeping the output at all. The action excludes them by default
      # to avoid uploading secrets by accident; nothing writes a secret here,
      # since this tree is only ever the files a model returned.
      - name: Upload the candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bakeoff-candidates
          path: ${{ runner.temp }}/candidates
          include-hidden-files: true
          if-no-files-found: warn

  # Whether what was accepted builds, which the run above never checked
  # (internal PR 59): a person exporting a candidate runs npm install and npm run build
  # next. A separate job on purpose. A candidate's package.json and build
  # config are code a model wrote, and they run here, so this job has no
  # environment and so no provider key to reach; build-candidates.ts also
  # hands npm nothing but PATH, HOME and network settings.
  build:
    name: Build what was accepted
    needs: bakeoff
    if: always() && needs.bakeoff.result != 'skipped'
    runs-on: ubuntu-24.04
    # Candidates build one after another, each allowed 13 minutes at worst.
    # The script is given what is left of these 180 minutes, less a reserve,
    # and starts no candidate it could not finish in them, so a large
    # bakeoff ends by naming the candidates it never reached rather than
    # being killed part way through.
    timeout-minutes: 180
    # Not the gate any more. With --results a candidate that does not build
    # is a result, written to the file for the repair and then the report,
    # and this job fails only when it could not produce trustworthy results
    # (a container that would not start or be removed, a snapshot that
    # changed). Failing it for every broken candidate would mark it failed
    # on the ordinary path of a bakeoff whose repair then fixes them. The
    # report job is the gate.

    steps:
      # The job's clock starts here, not when the build step does: checkout,
      # setup, the download and the image pull all spend it first (internal PR 237
      # review).
      - name: Note when the job started
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The build runs code a model wrote. A persisted credential would sit
          # on disk where that code can read it, whatever the environment says.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the candidates
        uses: actions/download-artifact@v8
        with:
          name: bakeoff-candidates
          path: ${{ runner.temp }}/candidates

      - name: Install and build each candidate
        # Each candidate in a container of its own, so no candidate can reach
        # another's files or leave a process running into the next one's
        # turn. Pulled first so the pull is not charged to a candidate.
        # The budget is the job's 180 minutes, less what the steps before
        # this spent, less 5 for the steps after it. At least 1, so a job
        # with nothing left still reports every candidate as not built.
        run: |
          docker pull node:24-bookworm-slim
          minutes=$(( (180 * 60 - ($(date +%s) - JOB_STARTED)) / 60 - 5 ))
          [ "$minutes" -ge 1 ] || minutes=1
          node --experimental-strip-types packages/eval/bin/build-candidates.ts "$RUNNER_TEMP/candidates" "$minutes" --container node:24-bookworm-slim --results "$RUNNER_TEMP/build-results/build-results.json"

      # Written by this script on the runner, outside every candidate's
      # container, so no candidate can reach it. The repair job still reads
      # it as untrusted data, because what a build printed is in it.
      - name: Upload the build results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bakeoff-build-results
          path: ${{ runner.temp }}/build-results
          if-no-files-found: warn

  # One repair turn for every candidate that passed the eval's checks and
  # then did not install or build, sent the way the product sends it: the
  # exact build error, in the product's repair prompt, with the candidate's
  # files as the project to edit (packages/eval/src/repair.ts). It holds the
  # model keys, as the bakeoff job does, and so it never builds, installs or
  # runs anything a model wrote: the candidates are read as text, the build
  # results are read as data, and the repaired projects are written as text
  # for the next job to build.
  repair:
    name: Repair what did not build
    needs: [bakeoff, build]
    # !cancelled() rather than always(), which also runs after the workflow
    # is cancelled, and this job spends money. It still runs after a failed
    # bakeoff job, because one rejected run fails that job, and after a
    # failed build job, whose results are uploaded either way.
    if: ${{ !cancelled() && needs.bakeoff.result != 'skipped' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    # One model call per repaired candidate, each as long as a generation.
    timeout-minutes: 60
    environment: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing here runs a model's code, but nothing here needs to push
          # either, and a job holding keys keeps no more than it uses.
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Before the downloads, so nothing a model wrote is on disk while
      # dependencies install, and never inside the checkout: the candidates
      # go to the runner's temporary directory, where no pnpm or npm command
      # in this job looks for configuration.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the candidates
        uses: actions/download-artifact@v8
        with:
          name: bakeoff-candidates
          path: ${{ runner.temp }}/candidates

      - name: Download the build results
        uses: actions/download-artifact@v8
        with:
          name: bakeoff-build-results
          path: ${{ runner.temp }}/build-results

      # A repair is a bounded build like the first, so its file steps are
      # asked at the same effort the candidates were (D70): the arm being
      # measured is the whole path, repair included. Checked again here
      # because this job runs even when the bakeoff job, which checks it
      # first, failed.
      - name: Repair each candidate that did not build
        shell: bash
        env:
          VIBLD_EVAL_LIVE: '1'
          WRITE_EFFORT: ${{ inputs.write_effort }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          case "$WRITE_EFFORT" in
            '') ;;
            low|medium|high|xhigh|max) export VIBLD_WRITE_EFFORT="$WRITE_EFFORT" ;;
            *) echo "::error::write_effort must be blank or one of low, medium, high, xhigh, max, not \"$WRITE_EFFORT\"."; exit 1 ;;
          esac
          pnpm --filter @vibld/eval run repair "$RUNNER_TEMP/candidates" "$RUNNER_TEMP/build-results/build-results.json" "$RUNNER_TEMP/repaired"

      # include-hidden-files for the reason the candidates upload gives: a
      # repaired project missing its .gitignore is not the project that was
      # checked.
      - name: Upload the repaired candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bakeoff-repaired
          path: ${{ runner.temp }}/repaired
          include-hidden-files: true
          if-no-files-found: warn

  # The repaired projects, built exactly as the first ones were, and for the
  # same reason in a job of its own: a repair is code a model wrote.
  build-repaired:
    name: Build what the repair wrote
    needs: repair
    if: always() && needs.repair.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # As in the build job, a candidate that does not build is a result for
    # the report, not a failure of this job.

    steps:
      - name: Note when the job started
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The build runs code a model wrote. A persisted credential would sit
          # on disk where that code can read it, whatever the environment says.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the repaired candidates
        uses: actions/download-artifact@v8
        with:
          name: bakeoff-repaired
          path: ${{ runner.temp }}/repaired

      - name: Install and build each repaired candidate
        run: |
          docker pull node:24-bookworm-slim
          minutes=$(( (180 * 60 - ($(date +%s) - JOB_STARTED)) / 60 - 5 ))
          [ "$minutes" -ge 1 ] || minutes=1
          node --experimental-strip-types packages/eval/bin/build-candidates.ts "$RUNNER_TEMP/repaired" "$minutes" --container node:24-bookworm-slim --results "$RUNNER_TEMP/rebuild-results/rebuild-results.json"

      - name: Upload the build results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bakeoff-repaired-build-results
          path: ${{ runner.temp }}/rebuild-results
          if-no-files-found: warn

  # Two figures per model, and what every rejected run was rejected for.
  # No keys and no dependencies: it reads four JSON files with Node alone.
  #
  # This job is the bakeoff's gate. It fails unless every run was accepted
  # after at most one repair, which is how the bakeoff has always reported a
  # rejected run, now applied to the final answer: a run the repair rescued
  # no longer fails it, and a run that passed its checks and did not build
  # now does.
  report:
    name: Report
    needs: [bakeoff, build, repair, build-repaired]
    if: always() && needs.bakeoff.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Each may be missing, when the job that writes it did not run. The
      # report then names what it did not find and rejects the runs that
      # depended on it, so a missing file can never read as a pass.
      - name: Download the candidates
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bakeoff-candidates
          path: ${{ runner.temp }}/candidates

      - name: Download the build results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bakeoff-build-results
          path: ${{ runner.temp }}/build-results

      - name: Download the repaired candidates
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bakeoff-repaired
          path: ${{ runner.temp }}/repaired

      - name: Download the repaired build results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bakeoff-repaired-build-results
          path: ${{ runner.temp }}/rebuild-results

      # Above the table, so a verdict copied out of this run still says
      # which arm of the D70 comparison it is. Only a value the bakeoff job
      # would accept is printed; anything else is said to be invalid, since
      # both jobs that generate refuse it before spending anything.
      - name: Say which effort the file steps were asked at
        shell: bash
        env:
          WRITE_EFFORT: ${{ inputs.write_effort }}
        run: |
          set -euo pipefail
          case "$WRITE_EFFORT" in
            '') line='Effort: every step at its default.' ;;
            low|medium|high|xhigh|max) line="Effort: the file-writing steps at $WRITE_EFFORT; the outline at its default." ;;
            *) line='Effort: write_effort was not one of the allowed values, so nothing was generated at it.' ;;
          esac
          echo "$line"
          printf '**%s**\n\n' "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        run: >-
          node --experimental-strip-types packages/eval/bin/bakeoff-report.ts
          --eval "$RUNNER_TEMP/candidates/eval-results.json"
          --build "$RUNNER_TEMP/build-results/build-results.json"
          --repair "$RUNNER_TEMP/repaired/repair-results.json"
          --rebuild "$RUNNER_TEMP/rebuild-results/rebuild-results.json"
