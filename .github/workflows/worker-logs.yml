name: Read the Worker's recent logs

# The builder shows "try again shortly" for any failure it cannot explain,
# and the reason is only in the Worker's own logs (observability is on in
# wrangler.jsonc). This prints the recent ones into the job log, so a
# failure somebody saw can be diagnosed without opening the dashboard.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How far back to read
        required: true
        default: '60'
      errors_only:
        description: Only events with an error, a warning, or a 5xx status
        type: boolean
        default: true
      service:
        description: Which Worker (vibld-web-preview, or vibld-preview for the sandboxes)
        required: true
        default: vibld-web-preview
      match:
        description: Only events whose message contains this text (empty for all)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  logs:
    name: Read the logs
    if: github.repository == 'vibld/vibld-internal'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: preview
    steps:
      - name: Query Workers Observability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.minutes }}
          ERRORS_ONLY: ${{ inputs.errors_only }}
          SERVICE: ${{ inputs.service }}
          MATCH: ${{ inputs.match }}
        run: |
          set -euo pipefail
          case "$MINUTES" in ''|*[!0-9]*) echo "::error::minutes must be a number"; exit 1 ;; esac
          case "$SERVICE" in vibld-web-preview|vibld-preview) ;; *) echo "::error::service must be vibld-web-preview or vibld-preview"; exit 1 ;; esac
          to=$(( $(date +%s) * 1000 ))
          from=$(( to - MINUTES * 60 * 1000 ))
          body=$(jq -n --argjson from "$from" --argjson to "$to" --arg service "$SERVICE" '{
            queryId: "worker-logs",
            timeframe: { from: $from, to: $to },
            view: "events",
            limit: 2000,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [
                { key: "$metadata.service", operation: "eq", type: "string", value: $service }
              ]
            }
          }')
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$body" > response.json
          if [ "$(jq -r '.success' response.json)" != "true" ]; then
            echo "::error::The query was refused"
            jq -c '.errors' response.json
            exit 1
          fi
          echo "Events returned: $(jq '.result.events.events | length' response.json)"
          # Only fields about the request and the error. Never headers or
          # bodies, which is where a token or a person's text would be.
          jq -r --arg errorsOnly "$ERRORS_ONLY" --arg match "$MATCH" '
            .result.events.events
            | sort_by(.timestamp)
            | map(select(
                $match == ""
                or ((.["$metadata"].message // "") | contains($match))
              ))
            | map(select(
                $errorsOnly != "true"
                or (.["$metadata"].error // "") != ""
                or ((.["$metadata"].level // "") | test("error|warn"; "i"))
                or ((.["$metadata"].statusCode // 0) >= 500)
                or ((.["$workers"].outcome // "ok") != "ok")
              ))
            | .[]
            | [
                (.timestamp / 1000 | todate),
                (.["$metadata"].statusCode // "-" | tostring),
                (.["$workers"].outcome // "-"),
                (.["$metadata"].level // "-"),
                ((.["$metadata"].url // "") | sub("\\?.*$"; "")),
                ((.["$metadata"].error // "") | .[0:400]),
                ((.["$metadata"].message // "") | .[0:400])
              ]
            | join(" | ")
          ' response.json
