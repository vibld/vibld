name: Read the Worker's recent logs

# The builder shows "try again shortly" for any failure it cannot explain,
# and the reason is only in the Worker's own logs (observability is on in
# wrangler.jsonc). This prints the recent ones into the job log, so a
# failure somebody saw can be diagnosed without opening the dashboard, and
# the per-step timings the Workers log (generation.step, preview.step,
# preview.updated) can be read as a table. scripts/worker-logs.mjs builds the
# query and prints the result.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How far back to read
        required: true
        default: '60'
      errors_only:
        description: Only events with an error, a warning, or a 5xx status
        type: boolean
        default: true
      service:
        description: Which Worker (vibld-web-preview, or vibld-preview for the sandboxes)
        required: true
        default: vibld-web-preview
      match:
        description: Only events with this text in any field, logged JSON included, e.g. preview.step (empty for all)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  logs:
    name: Read the logs
    if: github.repository == 'vibld/vibld-internal'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Query Workers Observability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.minutes }}
          ERRORS_ONLY: ${{ inputs.errors_only }}
          SERVICE: ${{ inputs.service }}
          MATCH: ${{ inputs.match }}
        run: |
          set -euo pipefail
          case "$MINUTES" in ''|*[!0-9]*) echo "::error::minutes must be a number"; exit 1 ;; esac
          case "$SERVICE" in vibld-web-preview|vibld-preview) ;; *) echo "::error::service must be vibld-web-preview or vibld-preview"; exit 1 ;; esac
          to=$(( $(date +%s) * 1000 ))
          from=$(( to - MINUTES * 60 * 1000 ))
          # The match goes to Cloudflare as the query's needle, so it is
          # applied to every field, the logged JSON included, before the
          # row limit.
          node scripts/worker-logs.mjs body "$from" "$to" "$SERVICE" "$MATCH" > body.json
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @body.json > response.json
          if [ "$(jq -r '.success' response.json)" != "true" ]; then
            echo "::error::The query was refused"
            jq -c '.errors' response.json
            exit 1
          fi
          # One line per event, what our code logged beside the request's
          # own fields (never headers or bodies), then a table of step
          # timings (generation.step, preview.step, preview.updated) that
          # also goes to the run's summary.
          node scripts/worker-logs.mjs print response.json
