name: Try a generation

# Runs one real model generation and writes the result into the run summary,
# so the adapter can be exercised from the GitHub UI on any device without a
# terminal. Manual only: every run spends model tokens.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: What should Vibld build?
        required: true
        default: A landing page for a cybersecurity SaaS with pricing, an FAQ and a contact form. Heavy animation. Navy, dark purple and neon yellow.
      build:
        description: Also install and build the generated project (proves portability)
        type: boolean
        default: true
      follow_up:
        description: >-
          Optional second prompt. Runs a follow-up generation against the first
          project and reports what it kept, changed, added and removed. This is
          the only way to check ADR-0009 against a real model -- and it spends a
          second generation's tokens.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: try-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require a model credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set on the 'preview' environment"
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate
        id: generate
        shell: bash
        env:
          # The prompt is dispatch input, so it is untrusted text. It is passed
          # through the environment and only ever referenced as "$PROMPT";
          # interpolating ${{ inputs.prompt }} into this script would let a
          # crafted prompt run shell commands in a step that holds the API key.
          PROMPT: ${{ inputs.prompt }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo '## Prompt'
            echo
            printf '> %s\n' "$PROMPT"
            echo
            echo '## Result'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          pnpm --filter @vibld/ai plan "$PROMPT" --out "$RUNNER_TEMP/generated" \
            2>&1 | tee "$RUNNER_TEMP/plan.log"

          {
            cat "$RUNNER_TEMP/plan.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A second generation, given the first project. The point is the
      # removed count: the generation machine promotes exactly the file set
      # the model returns, so a file left out is a file deleted. Skipped
      # unless a follow-up prompt was given, because it spends tokens.
      - name: Iterate on the generated project
        if: ${{ inputs.follow_up != '' }}
        shell: bash
        env:
          # Dispatch input, so untrusted text. Passed through the environment
          # and only ever referenced as "$FOLLOW_UP"; interpolating it into
          # this script would let a crafted prompt run commands in a step
          # that holds the API key.
          FOLLOW_UP: ${{ inputs.follow_up }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo
            echo '## Follow-up'
            echo
            printf '> %s\n' "$FOLLOW_UP"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          pnpm --filter @vibld/ai plan "$FOLLOW_UP" \
            --base "$RUNNER_TEMP/generated" \
            --out "$RUNNER_TEMP/iterated" \
            2>&1 | tee "$RUNNER_TEMP/follow-up.log"

          {
            cat "$RUNNER_TEMP/follow-up.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs npm lifecycle scripts from a model-authored package.json. That is
      # arbitrary code on the runner, so this step deliberately holds no
      # secrets -- ANTHROPIC_API_KEY is scoped to the generate step above. The
      # runner is ephemeral and GITHUB_TOKEN is read-only.
      - name: Build the generated project
        if: ${{ inputs.build }}
        shell: bash
        working-directory: ${{ runner.temp }}/generated
        run: |
          # ADR-0002: the output must build with ordinary npm commands and no
          # Vibld package, account or service.
          set +e
          npm install --no-audit --no-fund > build.log 2>&1 && npm run build >> build.log 2>&1
          status=$?
          set -e
          {
            echo
            if [ $status -eq 0 ]; then
              echo '## Portability check: passed'
              echo
              echo 'The generated project installed and built with plain npm.'
            else
              echo '## Portability check: FAILED'
              echo
              echo 'The generated project did not build. Last 40 lines:'
              echo
              echo '```'
              tail -40 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the generated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-project
          path: ${{ runner.temp }}/generated
          if-no-files-found: ignore

      - name: Upload the iterated project
        if: ${{ always() && inputs.follow_up != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: iterated-project
          path: ${{ runner.temp }}/iterated
          if-no-files-found: ignore
