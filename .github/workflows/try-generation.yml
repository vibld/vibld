name: Try a generation

# Runs one real model generation and writes the result into the run summary,
# so the adapter can be exercised from the GitHub UI on any device without a
# terminal. Manual only: every run spends model tokens.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: What should Vibld build?
        required: true
        default: A landing page for a cybersecurity SaaS with pricing, an FAQ and a contact form. Heavy animation. Navy, dark purple and neon yellow.
      provider:
        description: Which service answers when no model is named below
        type: choice
        options: [anthropic, deepseek, openai]
        default: anthropic
      model:
        description: >-
          Optional model override, an id from the catalogue. A named model
          decides which service answers, so this wins over the choice above.
          Leave blank for that provider's default.
        required: false
        default: ''
      mockups:
        description: >-
          Ask for three directions instead of a build (#185). About a tenth of
          the tokens, and the only way to exercise the mockup path against a
          real model: everything else that touches it uses the fake client,
          which is how a schema bug that made it impossible on two of three
          providers survived five review rounds. Ignores the build option.
        type: boolean
        default: false
      style:
        description: >-
          Optional style preset id for a mockup run, the way the builder sends
          one once somebody has picked a direction. Ignored for a build.
        required: false
        default: ''
      max_tokens:
        description: >-
          Override the mockup output ceiling for one run, to measure what
          three documents really cost. MOCKUP_OUTPUT_TOKENS is 18,000, chosen
          from a description of what three sketches ought to be rather than
          from watching a model, and the first real run overran it. Leave
          blank to use the shipped ceiling. Ignored for a build.
        required: false
        default: ''
      build:
        description: Also install and build the generated project (proves portability)
        type: boolean
        default: true
      follow_up:
        description: >-
          Optional second prompt. Runs a follow-up generation against the first
          project and reports what it kept, changed, added and removed. This is
          the only way to check ADR-0009 against a real model -- and it spends a
          second generation's tokens.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: try-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # After install, because the answering provider is read from the
      # catalogue rather than guessed. A named model decides which service
      # answers (`providerForRequest`), so checking the key for the dropdown's
      # provider would check the wrong credential whenever the two disagree,
      # and fail mid-run on the one that was actually needed.
      - name: Require the credential this run will actually use
        env:
          PROVIDER: ${{ inputs.provider }}
          VIBLD_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # The model id is dispatch input, so it is read inside node from the
          # environment rather than interpolated into anything.
          #
          # The status is tested explicitly rather than left to `set -e`, which
          # does not reliably stop on a failing command substitution inside an
          # assignment. Measured: `v="$(node -e 'process.exit(1)')"` under
          # `set -euo pipefail` carried on with v empty, and an empty provider
          # falls through the case below to the Anthropic key, so the guard
          # would have checked a credential this run was never going to use.
          if ! answering="$(node --experimental-strip-types -e '
            const m = await import("./packages/ai/src/index.ts");
            const id = (process.env.VIBLD_MODEL ?? "").trim();
            const chosen = id ? m.findModel(id) : null;
            if (id && !chosen) {
              console.error(`::error::"${id}" is not a model in the catalogue.`);
              process.exit(1);
            }
            process.stdout.write(chosen ? chosen.provider : process.env.PROVIDER);
          ')"; then
            exit 1
          fi
          if [ -z "$answering" ]; then
            echo "::error::Could not work out which service would answer."
            exit 1
          fi
          case "$answering" in
            deepseek) key="$DEEPSEEK_API_KEY"; name=DEEPSEEK_API_KEY ;;
            openai)   key="$OPENAI_API_KEY"; name=OPENAI_API_KEY ;;
            *)        key="$ANTHROPIC_API_KEY"; name=ANTHROPIC_API_KEY ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::$name is not set on the 'preview' environment"
            exit 1
          fi
          if [ -n "${VIBLD_MODEL// /}" ] && [ "$answering" != "$PROVIDER" ]; then
            echo "Note: $VIBLD_MODEL is a $answering model, so $answering answers rather than $PROVIDER." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Using $answering" >> "$GITHUB_STEP_SUMMARY"

      # Three directions rather than a project (#185). Separate step rather
      # than a branch inside the one below, so neither run has to carry the
      # other's flags: this one has no --out project to build and no
      # follow-up to iterate on.
      - name: Ask for three directions
        if: ${{ inputs.mockups }}
        shell: bash
        env:
          # Dispatch input, so untrusted text. Passed through the environment
          # and only ever referenced as "$PROMPT": interpolating
          # ${{ inputs.prompt }} into this script would let a crafted prompt
          # run shell commands in a step that holds the API key.
          PROMPT: ${{ inputs.prompt }}
          STYLE: ${{ inputs.style }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          VIBLD_PROVIDER: ${{ inputs.provider }}
          VIBLD_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          {
            echo '## Prompt'
            echo
            printf '> %s\n' "$PROMPT"
            echo
            echo '## Three directions'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          args=("$PROMPT" --out "$RUNNER_TEMP/mockups")
          if [ -n "${STYLE// /}" ]; then
            args+=(--style "$STYLE")
          fi
          if [ -n "${MAX_TOKENS// /}" ]; then
            args+=(--max-tokens "$MAX_TOKENS")
          fi
          pnpm --filter @vibld/ai mockups "${args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/mockups.log"

          {
            cat "$RUNNER_TEMP/mockups.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept, so the three documents can be opened and looked at rather than
      # judged from their character counts.
      - name: Upload the directions
        if: ${{ inputs.mockups }}
        uses: actions/upload-artifact@v7
        with:
          name: mockups
          path: ${{ runner.temp }}/mockups
          if-no-files-found: error

      - name: Generate
        id: generate
        if: ${{ !inputs.mockups }}
        shell: bash
        env:
          # The prompt is dispatch input, so it is untrusted text. It is passed
          # through the environment and only ever referenced as "$PROMPT";
          # interpolating ${{ inputs.prompt }} into this script would let a
          # crafted prompt run shell commands in a step that holds the API key.
          PROMPT: ${{ inputs.prompt }}
          VIBLD_PROVIDER: ${{ inputs.provider }}
          VIBLD_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          {
            echo '## Prompt'
            echo
            printf '> %s\n' "$PROMPT"
            echo
            echo '## Result'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          pnpm --filter @vibld/ai plan "$PROMPT" --out "$RUNNER_TEMP/generated" \
            2>&1 | tee "$RUNNER_TEMP/plan.log"

          {
            cat "$RUNNER_TEMP/plan.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A second generation, given the first project. The point is the
      # removed count: the generation machine promotes exactly the file set
      # the model returns, so a file left out is a file deleted. Skipped
      # unless a follow-up prompt was given, because it spends tokens.
      - name: Iterate on the generated project
        if: ${{ inputs.follow_up != '' && !inputs.mockups }}
        shell: bash
        env:
          # Dispatch input, so untrusted text. Passed through the environment
          # and only ever referenced as "$FOLLOW_UP"; interpolating it into
          # this script would let a crafted prompt run commands in a step
          # that holds the API key.
          FOLLOW_UP: ${{ inputs.follow_up }}
          VIBLD_PROVIDER: ${{ inputs.provider }}
          VIBLD_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          {
            echo
            echo '## Follow-up'
            echo
            printf '> %s\n' "$FOLLOW_UP"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          pnpm --filter @vibld/ai plan "$FOLLOW_UP" \
            --base "$RUNNER_TEMP/generated" \
            --out "$RUNNER_TEMP/iterated" \
            2>&1 | tee "$RUNNER_TEMP/follow-up.log"

          {
            cat "$RUNNER_TEMP/follow-up.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs npm lifecycle scripts from a model-authored package.json. That is
      # arbitrary code on the runner, so this step deliberately holds no
      # secrets -- every model key is scoped to the generation steps above.
      # The runner is ephemeral and GITHUB_TOKEN is read-only.
      - name: Build the generated project
        # A mockup run produces three documents, not a project: there is
        # nothing here to install or build.
        if: ${{ inputs.build && !inputs.mockups }}
        shell: bash
        working-directory: ${{ runner.temp }}/generated
        run: |
          # ADR-0002: the output must build with ordinary npm commands and no
          # Vibld package, account or service.
          set +e
          npm install --no-audit --no-fund > build.log 2>&1 && npm run build >> build.log 2>&1
          status=$?
          set -e
          # To the job log as well as the summary, which is what a failure
          # on 2026-09-19 showed was missing: the portability check reported
          # "FAILED" with the cause only in the step summary, and the step
          # summary is not something the API serves. Diagnosing it meant
          # downloading a 34MB artifact to read forty lines. A failure whose
          # cause is only legible in a browser is a failure that gets guessed
          # at instead of read.
          if [ $status -ne 0 ]; then
            echo '--- portability check failed, last 40 lines of build.log ---'
            tail -40 build.log
            echo '--- end of build.log ---'
          fi

          {
            echo
            if [ $status -eq 0 ]; then
              echo '## Portability check: passed'
              echo
              echo 'The generated project installed and built with plain npm.'
            else
              echo '## Portability check: FAILED'
              echo
              echo 'The generated project did not build. Last 40 lines:'
              echo
              echo '```'
              tail -40 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # include-hidden-files for the same reason as the bakeoff: dotfiles are
      # excluded by default since upload-artifact v4.4, and a project without
      # its .gitignore is not the project that was generated. Nothing writes a
      # secret into these directories; the model keys are scoped to the
      # generation steps and never to a path under them.
      - name: Upload the generated project
        if: ${{ always() && !inputs.mockups }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-project
          path: ${{ runner.temp }}/generated
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload the iterated project
        if: ${{ always() && inputs.follow_up != '' && !inputs.mockups }}
        uses: actions/upload-artifact@v7
        with:
          name: iterated-project
          path: ${{ runner.temp }}/iterated
          include-hidden-files: true
          if-no-files-found: ignore
