name: CodeQL

on:
  push:
    branches: [main]
  # Deliberately unfiltered: a base-branch filter skips every pull request in
  # a stack, since those target an intermediate branch rather than main.
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write
  # `codeql-action/init` reads the run it is part of, and without this it
  # fails the whole job before analysing a line: "Resource not accessible by
  # integration" against the get-a-workflow-run endpoint. It started failing
  # on 2026-09-23 without this file changing, so it is a tightening on
  # GitHub's side rather than anything in the tree, and read access to
  # Actions is the documented requirement.
  actions: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    # Paused while the repository is private: code scanning on a private
    # repository needs GitHub Code Security, which this plan does not offer,
    # so the job could only fail. It runs again, unchanged, once the
    # repository is public, where code scanning is free.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4
