packages:
  - apps/*
  - packages/*
  - examples/*

# esbuild is a Vite dependency whose install script fetches the platform
# binary. pnpm blocks dependency build scripts by default; this allows that
# one and nothing else. wrangler (and the workerd binary it brings) is not a
# dependency: every deploy runs a pinned `pnpm dlx wrangler@<version>`.
allowBuilds:
  esbuild: true

# sharp is a dev dependency of apps/marketing (scripts/brand-assets.ts
# renders the brand PNGs with it), not something the deployed Worker ever
# runs -- but <0.35.4 carries a high-severity libheif vulnerability
# (GHSA-rgj7-g3m4-5g8c), so the floor holds wherever it is resolved.
overrides:
  sharp: '>=0.35.4'
